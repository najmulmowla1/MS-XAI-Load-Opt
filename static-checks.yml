name: Repository integrity
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source and manifest
        run: python -m unittest discover -s tests -v
      - name: Check runner interface
        run: python run_pipeline.py --help
